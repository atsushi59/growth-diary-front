version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node 22 で揃える（package.json engines と一致。Amplify 既定イメージは古い場合があるため明示）
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # 型チェック + Vite 本番ビルド（出力は dist/）
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
